<text x="30.0" y="492.0" font-family="'Comic Sans MS','Chalkboard SE','Bradley Hand',Segoe Print,cursive,sans-serif" font-size="12" fill="#8a8598" text-anchor="start" font-weight="normal">The two compaction arms tie here exactly, as they do on the deterministic</text>
